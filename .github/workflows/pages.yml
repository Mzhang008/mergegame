name: Test and deploy

on:
  push:
    branches:
      - main
      - claude/upbeat-tesla-g9Hci
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-chromium
          path: test-results/
          retention-days: 7

  # Safari's engine (iPhone players). Informational for now: a failure here
  # is reported but does not block a deploy.
  test-webkit:
    name: Tests (WebKit, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit
      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-webkit
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./game
      - id: deployment
        uses: actions/deploy-pages@v4
