<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sakura Merge — Prototype v0.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header class="stats">
    <div class="stat">
      <div class="stat-label">Energy</div>
      <div class="stat-val"><span id="energy">120</span><span class="stat-max">/120</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Coins</div>
      <div class="stat-val" id="coins">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">XP</div>
      <div class="stat-val" id="xp">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Level</div>
      <div class="stat-val" id="level">1</div>
    </div>
  </header>

  <div class="quest-panel" id="quest">
    <div class="quest-info">
      <div class="quest-label">Quest</div>
      <div class="quest-text" id="quest-text">Deliver a Tier-3 Blooming Branch</div>
      <div class="quest-reward" id="quest-reward">+15 coins, +25 XP</div>
    </div>
    <button class="quest-deliver" id="quest-deliver">Deliver</button>
  </div>

  <div class="rest-panel" id="restoration">
    <div class="rest-row rest-top">
      <div class="rest-meta">
        <div class="rest-label">Restoration · Step <span id="step-num">1</span>/4</div>
        <div class="rest-name" id="step-name">Clear the path</div>
      </div>
      <div class="rest-art" id="village-art">🪨 🌿 🪨</div>
    </div>
    <div class="rest-row rest-bottom">
      <div class="sockets" id="sockets"></div>
      <button class="rest-complete" id="step-complete" disabled>
        <span class="rest-cost"><span id="step-cost">30</span> 🪙</span>
        <span class="rest-action">Restore</span>
      </button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn-primary" id="generator">
      <span class="gen-icon">🌳</span>
      <span class="gen-label">Sakura Tree</span>
      <span class="gen-cost">-1 ⚡</span>
    </button>
    <button class="btn-secondary" id="reset" title="Reset">↺</button>
  </div>

  <div class="toast" id="toast"></div>
  <footer>
    Sakura Merge · Prototype v0.2<br>
    <span class="hint">Drag items to merge or deposit into restoration sockets</span>
  </footer>
</div>

<script src="game.js"></script>
</body>
</html>
